name: Construir app Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Comprobar el archivo de efemérides
        run: python3 -c "import json; d=json.load(open('data/efemerides.json')); print(len(d), 'efemérides')"
      - name: Pruebas y compilación
        run: ./gradlew testDebugUnitTest assembleDebug
      - name: Guardar la app (APK)
        uses: actions/upload-artifact@v4
        with:
          name: cordoba-en-efemerides-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar capturas de las pantallas
        uses: actions/upload-artifact@v4
        with:
          name: capturas-de-pantalla
          path: app/build/capturas/
