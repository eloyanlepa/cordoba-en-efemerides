<body>
  <header class="barra">
    <h1>Córdoba en Efemérides</h1>
    <button id="boton-letra" class="boton-barra" aria-label="Tamaño de letra">Aa</button>

  <div id="aviso-instalar" class="aviso-instalar" hidden>
    <p>📲 <strong>Instálala en tu iPhone:</strong> pulsa <strong>Compartir</strong>

    <button id="cerrar-aviso" class="boton-texto" aria-label="Cerrar">✕</button>
  </div>

  <main id="contenido" tabindex="-1"><p class="vacio">Cargando efemérides…</p></main>

  <nav class="pestanas" aria-label="Secciones">
    <a href="#hoy" data-pestana="hoy">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>Hoy</a>
    <a href="#calendario" data-pestana="calendario">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h5v5H7z"/></svg>Calendario</a>
    <a href="#buscar" data-pestana="buscar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.8l-.3-.3A6.5 6.5 0 1 0 9.5 16a6.5 6.5 0 0 0 4.2-1.6l.3.3v.8l5 5 1.5-1.5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>Buscar</a>
    <a href="#favoritas" data-pestana="favoritas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 17.3 18.2 21l-1.6-7L22 9.2l-7.2-.6L12 2 9.2 8.6 2 9.2 7.4 14l-1.6 7z"/></svg>Favoritas</a>
    <a href="#juego" data-pestana="juego">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2.1-7.8-.9.9A3.4 3.4 0 0 0 13 15h-2v-.5a4 4 0 0 1 1.2-2.8l1.2-1.3A2 2 0 1 0 10 9H8a4 4 0 1 1 7.1 2.2z"/></svg>Juego</a>
  </nav>

  <dialog id="dialogo-letra">
    <form method="dialog">
      <h2>Tamaño de letra</h2>
      <div class="opciones-letra">
        <button value="0.9">Pequeña</button>
        <button value="1">Normal</button>
        <button value="1.2">Grande</button>
        <button value="1.4">Muy grande</button>
      </div>
      <button value="" class="boton-texto">Cerrar</button>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
